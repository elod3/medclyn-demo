server {
    listen       80;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;
    # woff2 e deja comprimat, nu il mai trecem prin gzip

    # Fonturile au numele dupa continut, deci pot sta in cache un an.
    location ~* \.woff2$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }
    # JS, CSS si imaginile nu sunt versionate prin nume: o zi, apoi revalidare.
    location ~* \.(js|css|webp|jpg|png|svg|hdr|glb)$ {
        add_header Cache-Control "public, max-age=86400, must-revalidate";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
    }

    # Adresele vechi de pe medclyn.com (articole, magazin, categorii) -> paginile noi, 301.
    include /etc/nginx/conf.d/redirects.inc;

    # add_header dintr-un location anulează pe cele de la nivel de server,
    # de aceea antetele de securitate se repetă în fiecare location.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}
